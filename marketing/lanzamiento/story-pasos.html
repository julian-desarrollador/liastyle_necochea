<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-dark">
    <main class="canvas">
      <section class="safe stack">
        <img class="logo" src="../../public/logo lia style.PNG" alt="Lia Style" style="width: 150px; height: 150px" />
        <p class="eyebrow">Cómo reservar</p>
        <h1 class="headline" style="margin-top: 22px; font-size: 64px">
          En 3 pasos,<br />listo.
        </h1>
        <div class="steps">
          <article class="step">
            <div class="num">01</div>
            <div>
              <h3>Entrá al sitio</h3>
              <p>liastylenecochea.com</p>
            </div>
          </article>
          <article class="step">
            <div class="num">02</div>
            <div>
              <h3>Elegí servicio y horario</h3>
              <p>Ves los turnos libres y elegís el tuyo.</p>
            </div>
          </article>
          <article class="step">
            <div class="num">03</div>
            <div>
              <h3>Confirmá</h3>
              <p>Sin llamadas. Sin esperar que te contesten.</p>
            </div>
          </article>
        </div>
        <div class="cta-wrap">
          <div class="url">liastylenecochea.com</div>
          <p class="cta-note">Guardalo en favoritos</p>
        </div>
      </section>
    </main>
  </body>
</html>
