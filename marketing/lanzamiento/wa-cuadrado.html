<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    body.square {
      background: radial-gradient(800px 700px at 50% 0%, #fbf7f1, #efe8dc 70%);
      color: var(--ink);
    }
    .box {
      width: 1080px;
      height: 1080px;
      padding: 88px 80px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      justify-content: center;
    }
    .logo { width: 168px; height: 168px; object-fit: contain; }
    h1 {
      margin: 28px 0 0;
      font-size: 62px;
      font-weight: 600;
      line-height: 1;
      color: var(--taupe-deep);
    }
    .sub {
      margin: 22px 0 0;
      font-size: 26px;
      font-weight: 500;
      color: #5f5a50;
    }
    .cta {
      margin-top: 56px;
      width: 100%;
      padding: 32px 20px;
      border-radius: 999px;
      background: var(--taupe-deep);
      color: #f6f1ea;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .foot {
      margin-top: 28px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #8a8476;
      text-transform: none;
    }
  </style>
</head>
<body class="square">
  <div class="box">
    <img class="logo" src="assets/logo-ls.png" alt="Lia Style" />
    <h1 class="serif">Ya podés reservar<br>tu turno online</h1>
    <p class="sans sub">Elegí día y horario · Las 24 hs · Sin llamadas</p>
    <div class="sans cta">liastylenecochea.com</div>
    <p class="sans foot">@_liastyle.necochea</p>
  </div>
</body>
</html>
