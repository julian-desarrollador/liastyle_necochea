<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="theme-photo">
    <main class="canvas">
      <img
        class="bg-photo"
        src="../../public/fondo_inicio5.jpeg"
        alt=""
        style="object-position: 72% 28%"
      />
      <div
        class="scrim"
        style="
          background: linear-gradient(
            to bottom,
            rgba(20, 19, 19, 0.55) 0%,
            rgba(20, 19, 19, 0.18) 28%,
            rgba(20, 19, 19, 0.42) 52%,
            rgba(20, 19, 19, 0.92) 100%
          );
        "
      ></div>
      <section class="safe">
        <img class="logo" src="../../public/logo lia style.PNG" alt="Lia Style" />
        <p class="eyebrow">Lia Style · Necochea</p>
        <h1 class="headline" style="margin-top: auto; font-size: 72px">
          ¡Ya podés reservar<br />tu turno online!
        </h1>
        <p class="sub">Elegí día y horario sin llamar ni esperar respuesta.</p>
        <div class="cta-wrap pin-bottom" style="margin-top: 48px; flex: none">
          <div class="url">liastylenecochea.com</div>
          <p class="cta-note">Reservá las 24 hs</p>
        </div>
      </section>
    </main>
  </body>
</html>
