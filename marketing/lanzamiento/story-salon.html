<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    body { background: #1a1814; color: #f6f1ea; }
    .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
    .frame img.bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 78% 42%;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(20,18,16,0.18) 0%, rgba(20,18,16,0.08) 28%, rgba(20,18,16,0.35) 52%, rgba(16,14,12,0.92) 100%);
    }
    .safe {
      position: relative;
      z-index: 2;
      height: 1920px;
      padding: 200px 80px 230px;
      display: flex;
      flex-direction: column;
    }
    .logo {
      width: 148px;
      height: 148px;
      align-self: center;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.35));
    }
    .script-label {
      margin-top: auto;
      font-size: 72px;
      line-height: 1;
      color: #d7e6f3;
      text-shadow: 0 10px 28px rgba(0,0,0,0.35);
    }
    h1 {
      margin: 8px 0 0;
      font-size: 86px;
      font-weight: 600;
      line-height: 0.95;
      letter-spacing: -0.025em;
    }
    .sub {
      margin: 28px 0 0;
      max-width: 820px;
      font-size: 30px;
      font-weight: 500;
      line-height: 1.45;
      color: rgba(246,241,234,0.86);
    }
    .cta {
      margin-top: 48px;
      align-self: flex-start;
      padding: 28px 46px 26px;
      border-radius: 999px;
      background: #7da3c4;
      color: #1b242c;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .handle {
      margin-top: 28px;
      margin-bottom: 12px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(246,241,234,0.72);
    }
  </style>
</head>
<body class="story">
  <div class="frame">
    <img class="bg" src="assets/salon.jpg" alt="" />
    <div class="veil"></div>
    <div class="safe">
      <img class="logo" src="assets/logo-ls.png" alt="Lia Style" />
      <p class="script script-label">Novedad</p>
      <h1 class="serif">Ya podés<br>reservar tu<br>turno online</h1>
      <p class="sans sub">Elegí día y horario las 24 hs.<br>Sin llamadas ni esperas.</p>
      <div class="sans cta">liastylenecochea.com</div>
      <p class="sans handle">@_liastyle.necochea</p>
    </div>
  </div>
</body>
</html>
