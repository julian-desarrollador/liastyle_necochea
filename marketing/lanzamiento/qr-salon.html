<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    body.square {
      background: #f4f0ea;
      color: var(--ink);
    }
    .box {
      width: 1080px;
      height: 1080px;
      padding: 70px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo { width: 140px; height: 140px; object-fit: contain; }
    h1 {
      margin: 18px 0 0;
      font-size: 48px;
      font-weight: 600;
      color: var(--taupe-deep);
    }
    .qr {
      margin: 28px 0 0;
      width: 520px;
      height: 520px;
      padding: 22px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(42,39,34,0.08);
    }
    .qr img { width: 100%; height: 100%; }
    .url {
      margin-top: auto;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--taupe-deep);
    }
    .foot {
      margin-top: 10px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #8a8476;
    }
  </style>
</head>
<body class="square">
  <div class="box">
    <img class="logo" src="assets/logo-ls.png" alt="Lia Style" />
    <h1 class="serif">Reservá tu turno</h1>
    <div class="qr"><img src="assets/qr-liastyle.png" alt="QR liastylenecochea.com" /></div>
    <p class="sans url">liastylenecochea.com</p>
    <p class="sans foot">Escaneá y elegí tu horario</p>
  </div>
</body>
</html>
