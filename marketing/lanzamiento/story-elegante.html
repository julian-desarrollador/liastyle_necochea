<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    body {
      background: radial-gradient(1200px 900px at 50% 0%, #fbf8f3 0%, var(--cream) 55%, #ece6dc 100%);
      color: var(--ink);
    }
    .safe {
      height: 1920px;
      padding: 200px 88px 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: 236px;
      height: 236px;
      object-fit: contain;
    }
    .eyebrow {
      margin-top: 40px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: var(--dusty);
    }
    h1 {
      margin: 24px 0 0;
      font-size: 76px;
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--taupe-deep);
    }
    .rule {
      display: flex;
      align-items: center;
      gap: 18px;
      margin: 40px 0 0;
      width: 420px;
    }
    .rule span {
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .rule i {
      width: 10px;
      height: 10px;
      transform: rotate(45deg);
      background: var(--dusty);
    }
    .benefits {
      margin: 36px 0 0;
      padding: 28px 36px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      background: rgba(255,255,255,0.55);
      border-radius: 28px;
    }
    .benefits li {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: #3d3a34;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 12px;
      border-radius: 50%;
      background: var(--dusty);
      vertical-align: middle;
    }
    .cta {
      margin-top: 88px;
      width: 100%;
      padding: 34px 28px 32px;
      border-radius: 999px;
      background: var(--taupe-deep);
      color: #f7f3ec;
      font-size: 36px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .hint {
      margin: 20px 0 0;
      font-size: 24px;
      font-weight: 500;
      color: #6b675c;
    }
    .foot {
      margin-top: 48px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #8a8476;
    }
  </style>
</head>
<body class="story">
  <div class="safe">
    <img class="logo" src="assets/logo-ls.png" alt="Lia Style" />
    <p class="sans eyebrow">Novedad</p>
    <h1 class="serif">¡Ya podés<br>reservar tu<br>turno online!</h1>
    <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>
    <ul class="sans benefits">
      <li><span class="dot"></span>Elegí el día y horario que te queda</li>
      <li><span class="dot"></span>Reservá las 24 hs, sin llamadas</li>
    </ul>
    <div class="sans cta">liastylenecochea.com</div>
    <p class="sans hint">Entrá y elegí tu día y horario</p>
    <p class="sans foot">Color · Corte · Peinado</p>
  </div>
</body>
</html>
