<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="fonts.css" />
  <style>
    body { background: #141313; color: #eeeae4; }
    .wrap {
      width: 1080px;
      height: 1920px;
      padding: 190px 72px 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background:
        radial-gradient(900px 520px at 50% 18%, rgba(125,163,196,0.16), transparent 70%),
        #141313;
    }
    .eyebrow {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9bb7d4;
    }
    h1 {
      margin: 18px 0 0;
      text-align: center;
      font-size: 64px;
      font-weight: 600;
      line-height: 1.02;
    }
    .phone {
      margin-top: 48px;
      width: 560px;
      height: 1040px;
      padding: 14px;
      border-radius: 56px;
      background: #0b0b0b;
      box-shadow: 0 40px 80px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .phone img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 0;
      border-radius: 44px;
    }
    .cta {
      margin-top: auto;
      width: 100%;
      padding: 30px 24px;
      border-radius: 999px;
      background: #7da3c4;
      color: #1f1814;
      text-align: center;
      font-size: 34px;
      font-weight: 700;
    }
    .hint {
      margin: 18px 0 0;
      font-size: 22px;
      font-weight: 500;
      color: rgba(238,234,228,0.7);
    }
  </style>
</head>
<body class="story">
  <div class="wrap">
    <p class="sans eyebrow">Así de fácil</p>
    <h1 class="serif">Tu turno,<br>en un minuto</h1>
    <div class="phone"><img src="assets/app-home.png" alt="App Lia Style" /></div>
    <div class="sans cta">liastylenecochea.com</div>
    <p class="sans hint">Reservá online · Las 24 hs</p>
  </div>
</body>
</html>
