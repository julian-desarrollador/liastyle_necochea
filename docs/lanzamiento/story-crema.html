<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Lia Style — story crema</title>
    <link rel="stylesheet" href="story.css" />
  </head>
  <body class="story cream">
    <div class="frame">
      <img class="logo" src="assets/logo.png" alt="" />
      <p class="kicker">Desde hoy</p>
      <h1 class="headline">¡Ya podés<br />reservar tu turno<br />online!</h1>
      <div class="divider" aria-hidden="true"><span></span><i class="diamond"></i><span></span></div>
      <div class="benefits">
        <div class="benefit">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.5" y="5" width="17" height="15.5" rx="2.2" />
              <path d="M8 3.5v3.2M16 3.5v3.2M3.5 10h17" />
            </svg>
          </div>
          Elegí el día y horario que más te conviene
        </div>
        <div class="benefit">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.2" />
              <path d="M12 8v4.4l2.8 1.6" />
            </svg>
          </div>
          Reservá las 24 horas, cuando quieras
        </div>
        <div class="benefit">
          <div class="icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="8.2" />
              <path d="M8.2 12.2l2.5 2.5 5.2-5.3" />
            </svg>
          </div>
          Sin llamadas ni esperas
        </div>
      </div>
      <div class="cta">
        <div class="btn">Reservá tu turno<small>liastylenecochea.com</small></div>
        <p class="services">Color · Corte · Peinado</p>
      </div>
    </div>
  </body>
</html>
